<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Display - PainelSenhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex main-layout">
    <div th:replace="~{layout/sidebar :: sidebar('display')}"></div>

    <main class="flex-grow-1 display-bg">
        <div class="display-content">
            <span class="live-badge"><span class="live-dot"></span> AO VIVO</span>

            <p class="display-label">Senha atual</p>
            <p class="display-number"
               th:text="${ultimaChamada != null} ? ${ultimaChamada.codigo} : '— — — —'">N0000</p>

            <span th:if="${ultimaChamada != null and ultimaChamada.tipo.name() == 'PRIORITARIA'}"
                  class="display-badge prioritaria">
                    <i class="bi bi-star-fill"></i> Atendimento Prioritário
                </span>
            <span th:if="${ultimaChamada != null and ultimaChamada.tipo.name() != 'PRIORITARIA'}"
                  class="display-badge normal">Atendimento Normal</span>

            <div class="display-footer">
                <span><i class="bi bi-clock"></i> <span id="relogioDisplay">--:--:--</span></span>
                <span>·</span>
                <span>Atualização automática</span>
            </div>
        </div>
    </main>
</div>

<!-- Guarda o código da senha atual num atributo "invisível" para o JS ler -->
<div id="ticketData"
     th:attr="data-code=${ultimaChamada != null ? ultimaChamada.codigo : ''}"
     style="display:none;"></div>

<script>
    function tick() {
        document.getElementById('relogioDisplay').textContent = new Date().toLocaleTimeString('pt-BR');
    }
    tick();
    setInterval(tick, 1000);

    // ===== Beep quando a senha muda =====
    function playBeep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        function tone(freq, delay, duration) {
            setTimeout(() => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.0001, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            }, delay);
        }

        tone(880, 0, 0.4);    // primeiro bip (A5)
        tone(1046, 250, 0.35); // segundo bip mais agudo (C6) — padrão "ding-dong" de painel de senha
    }

    (function verificarMudancaSenha() {
        const codigoAtual = document.getElementById('ticketData').getAttribute('data-code');
        const codigoAnterior = localStorage.getItem('ultimaSenhaCode');

        if (codigoAtual && codigoAtual !== codigoAnterior) {
            if (codigoAnterior !== null) {
                playBeep();
            }
            localStorage.setItem('ultimaSenhaCode', codigoAtual);
        }
    })();
</script>
</body>
</html>
