<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel de Senhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="d-flex main-layout">
    <div th:replace="~{layout/sidebar :: sidebar('painel')}"></div>

    <main class="flex-grow-1 p-4">
        <div class="topbar d-flex justify-content-between align-items-center">
            <h4><i class="bi bi-headset me-2 text-success"></i>Painel do Atendente</h4>
            <span class="clock-badge"><i class="bi bi-clock"></i> <span id="relogio">--:--:--</span></span>
        </div>

        <!-- Stat cards calculados direto do histórico já recebido, sem tocar no backend -->
        <div class="stats-row mx-auto" style="max-width: 720px;">
            <div class="stat-card">
                <div class="stat-icon total"><i class="bi bi-ticket-perforated-fill"></i></div>
                <div>
                    <div class="stat-value" th:text="${#lists.size(historico)}">0</div>
                    <div class="stat-label">Emitidas hoje</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon normal"><i class="bi bi-people-fill"></i></div>
                <div>
                    <div class="stat-value" th:text="${#lists.size(historico.?[tipo.name() == 'NORMAL'])}">0</div>
                    <div class="stat-label">Normais</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon priority"><i class="bi bi-star-fill"></i></div>
                <div>
                    <div class="stat-value" th:text="${#lists.size(historico.?[tipo.name() == 'PRIORITARIA'])}">0</div>
                    <div class="stat-label">Prioritárias</div>
                </div>
            </div>
        </div>

        <div class="card-hero mx-auto" style="max-width: 720px;">
            <div class="card-top-bar"></div>
            <div class="card-body-custom">
                <p class="eyebrow">Última senha chamada</p>
                <p class="ticket-number"
                   th:text="${ultimaSenha != null} ? ${ultimaSenha.codigo} : '— — — —'">N0000</p>

                <div class="action-buttons">
                    <form th:action="@{/atendente/gerar-normal}" method="post">
                        <button type="submit" class="btn-gen btn-normal">
                            <i class="bi bi-ticket-perforated"></i> Gerar Senha Normal
                        </button>
                    </form>
                    <form th:action="@{/atendente/gerar-prioridade}" method="post">
                        <button type="submit" class="btn-gen btn-priority">
                            <i class="bi bi-star-fill"></i> Gerar Senha Prioritária
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="history-panel mx-auto mt-4" style="max-width: 720px;">
            <p class="history-title"><i class="bi bi-clock-history me-2"></i>Histórico de hoje</p>

            <div th:each="senha : ${historico}" class="ticket-row">
                    <span>
                        <span class="ticket-code" th:text="${senha.codigo}">N0000</span>
                        <span th:if="${senha.tipo.name() == 'PRIORITARIA'}" class="badge-priority">
                            <i class="bi bi-star-fill"></i> Prioritária
                        </span>
                        <span th:unless="${senha.tipo.name() == 'PRIORITARIA'}" class="badge-normal">Normal</span>
                    </span>
                <span class="ticket-time" th:text="${#temporals.format(senha.horaChamada, 'HH:mm:ss')}">00:00:00</span>
            </div>
        </div>
    </main>
</div>

<script>
    function tick() {
        document.getElementById('relogio').textContent = new Date().toLocaleTimeString('pt-BR');
    }
    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
